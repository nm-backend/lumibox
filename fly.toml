# Fly.io. Разворачивает тот же production-образ из Dockerfile.
# Postgres и Redis на Fly создаются отдельно (fly postgres create,
# Upstash Redis) и подключаются секретами DATABASE_URL / REDIS_URL.
#
# Фоновые задачи (пересчёт рейтингов, прогрев кэша) выполняются по
# расписанию Celery beat. Поднять воркер и планировщик отдельными
# машинами в process groups:
#
#   fly machine run --app <app> "celery -A config worker -l info" \
#       --name worker --process-group worker
#   fly machine run --app <app> "celery -A config beat -l info" \
#       --name beat --process-group beat
#
# Worker обязательно нужен при заданном REDIS_URL: без него задачи
# копятся в очереди, а beat-задачи (warm-home-cache и др.) не выполняются.
# Без REDIS_URL Celery работает в eager-режиме и воркер не требуется.
app = "lumibox"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  DJANGO_DEBUG = "False"
  DJANGO_NUM_PROXIES = "1"

# Миграции прогоняются до переключения трафика на новую версию.
[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false      # не усыплять: цель — работать 24/7
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/healthz/"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

# Загруженные постеры и кадры — на постоянном томе.
[mounts]
  source = "lumibox_media"
  destination = "/app/media"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
