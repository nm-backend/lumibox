name: CI

# Гоняем проверки на каждый push и pull request в main.
# Зелёный прогон = код готов к деплою: линт, миграции, боевые проверки, тесты.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lumibox
          POSTGRES_USER: lumibox
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumibox"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://lumibox:postgres@localhost:5432/lumibox
      REDIS_URL: redis://localhost:6379/0
      # Длина не меньше 50 символов — иначе check --deploy отдаёт W009 на каждом
      # прогоне. Постоянное предупреждение обесценивает шаг: на его фоне не
      # видно нового, настоящего. Ключ боевым не является, в бою он приходит
      # из переменной окружения и в репозитории не хранится.
      DJANGO_SECRET_KEY: ci-only-not-a-production-key-7f3a9d2e5b8c1046af93de27bc5081
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # Обязательно указать явно: без этого действие ищет requirements.txt
          # или pyproject.toml в корне, не находит (зависимости лежат в
          # requirements/) и роняет джобу на первом же шаге. Из-за этого CI
          # падал ещё до установки зависимостей, а значит ни линт, ни миграции,
          # ни тесты не выполнялись вовсе — красный CI ничего не проверял.
          cache-dependency-path: requirements/*.txt

      - name: Установка зависимостей
        run: pip install -r requirements/development.txt

      - name: Линт (ruff)
        run: ruff check apps config scripts

      - name: Брендинг без рецидивов
        # Тот же чек, что и pre-commit-хук: kg-*/kinogo не должны
        # возвращаться в разметку и код.
        run: python scripts/check_branding.py $(git ls-files)

      - name: Проверка проекта
        run: python manage.py check

      - name: Миграции без пропусков
        run: python manage.py makemigrations --check --dry-run

      - name: Боевые проверки безопасности
        # Ставим боевые зависимости: проверка идёт по production-настройкам,
        # а они поднимают whitenoise и django-storages. Без них шаг падал
        # не на реальной проблеме, а на отсутствующем модуле.
        #
        # --fail-level WARNING: без него шаг зелёный даже когда проверка нашла
        # проблему — check возвращает ненулевой код только на ERROR. Именно так
        # мимо гейта проходило предупреждение о SECRET_KEY.
        run: |
          pip install -r requirements/production.txt
          python manage.py check --deploy --fail-level WARNING --settings=config.settings.production

      - name: Тесты
        run: python manage.py test apps
