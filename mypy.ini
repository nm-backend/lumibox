# Статическая проверка типов (mypy).
#
# Django и DRF не поставляют типизацию (нет py.typed), поэтому чужие
# импорты игнорируем (--ignore-missing-imports) и проверяем только
# наш код. Миграции — сгенерированные файлы, их не трогаем.
#
# Запуск: mypy apps  (или mypy . в корне проекта)

[mypy]
python_version = 3.13
ignore_missing_imports = True
exclude = (^|/)migrations/
