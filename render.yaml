# LumiBox — Render Blueprint, БЕСПЛАТНЫЙ тариф ($0, без карты).
# Один web-сервис + бесплатный PostgreSQL. Render сам выдаёт HTTPS,
# следит за здоровьем и перезапускает упавшее.
#
# Redis и отдельного воркера здесь нет намеренно: их бесплатный тариф не даёт,
# а приложение к этому готово — без REDIS_URL кэш падает на память процесса,
# а фоновые задачи (пересчёт рейтингов) выполняются на месте (см. base.py).
# Рейтинг всё равно пересчитывается сигналами при каждом изменении отзыва.
#
# Ограничения бесплатного тарифа — честно:
#   • web засыпает после 15 минут тишины и просыпается на первый запрос
#     (~50 сек холодного старта). После выключения ноутбука сайт продолжает
#     работать и будится сам при заходе.
#   • бесплатный Postgres живёт 30 дней, потом его нужно пересоздать
#     (Render пришлёт письмо) или перевести на платный.
#   • постоянного диска на бесплатном тарифе нет: загруженные через админку
#     постеры сбрасываются при перезапуске, а демонстрационные заглушки
#     каждый раз рисуются заново на старте — витрина не пустеет.
#
# Задеплоить: Render → New → Blueprint → выбрать репозиторий → Apply.
# Плата не потребуется. Чтобы включить always-on без сна, Redis и воркер —
# см. render.paid.yaml.

databases:
  - name: lumibox-db
    databaseName: lumibox
    user: lumibox
    plan: free

services:
  - type: web
    name: lumibox-test-new
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    # На старте: миграции, наполнение демоданными (и отрисовка заглушек-постеров
    # в эфемерную ФС, раз постоянного диска нет), затем gunicorn на порту Render.
    #
    # Жёстко обязательны только миграции: без схемы сайт нерабочий. Наполнение
    # демоданными обёрнуто в «|| echo» намеренно: любой его сбой (например,
    # недоступный источник картинок) не должен мешать сайту подняться.
    dockerCommand: /app/scripts/run_web.sh
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true              # Render сгенерирует длинный ключ сам
      - key: DJANGO_DEBUG
        value: "False"
      # Домен *.onrender.com приложение добавит в разрешённые само (production.py),
      # поэтому для первого запуска поле можно оставить пустым.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lumibox-db
          property: connectionString
      # REDIS_URL намеренно НЕ задаём — включает локальный кэш и eager-задачи.
      - key: DJANGO_NUM_PROXIES
        value: "1"
      # Первый администратор создаётся при первом старте, если заданы обе.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # --- Vibix (реальный внешний плеер) ---
      # Publisher ID участвует только в публичном теге плеера. API-токен —
      # секрет: задайте его в Render Dashboard, в HTML он не попадает.
      - key: VIBIX_PUBLISHER_ID
        sync: false
      - key: VIBIX_API_TOKEN
        sync: false
      - key: VIBIX_API_BASE_URL
        value: https://vibix.org/api/v1
      - key: VIDEO_SERVICE_TRAILER
        value: "true"

      # --- Cloudflare R2 (опционально) ---
      # Без R2 медиа-файлы хранятся локально и сбрасываются при перезапуске.
      # Заполни эти переменные вручную в Dashboard Render после деплоя.
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT_URL
        sync: false
      - key: CLOUDFLARE_R2_REGION_NAME
        value: auto
      - key: CLOUDFLARE_R2_PUBLIC_URL
        sync: false

      # --- Sentry (опционально) ---
      # Бесплатный tier: 5 000 событий/мес. Если не задан — не инициализируется.
      - key: SENTRY_DSN
        sync: false

      # --- Google Analytics (опционально) ---
      # Если не задан — gtag не вставляется в шаблон.
      - key: GA_MEASUREMENT_ID
        sync: false

      # --- Email / SMTP (опционально, но нужен для сброса пароля) ---
      # Без этих переменных письма печатаются в консоль (сброс пароля не работает).
      # Бесплатные варианты: Mailgun (1 000/мес), SendGrid (100/день), Gmail SMTP.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "LumiBox <noreply@lumibox.app>"
