# Nginx перед gunicorn — для самостоятельного хостинга (VPS, Coolify, Hetzner).
# На PaaS (Render/Railway/Fly) он не нужен: там прокси и TLS даёт платформа.
# TLS-сертификаты здесь не прописаны намеренно — их выдаёт Certbot или сам
# Coolify/Traefik. Это апстрим-конфиг для HTTP за уже терминированным TLS.

upstream lumibox_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Постеры и кадры весят до 5 МБ — поднимаем лимит тела запроса.
    client_max_body_size 10M;

    # Статику и медиа отдаёт nginx напрямую — быстрее и не занимает
    # воркеры gunicorn. Требует общие тома static_data и media_data.
    #
    # Имена файлов статики содержат хеш содержимого (base.3638159a4b06.css):
    # при изменении меняется само имя, поэтому кэш можно держать год.
    # Раньше здесь стояли разом `expires 30d` и `add_header Cache-Control` —
    # nginx отправлял два заголовка Cache-Control (max-age=2592000 и
    # public, immutable), и какой возьмёт клиент, решал он сам. Оставляем один.
    #
    # На боевом сервере эта статика отдавалась с max-age=60: возвращающийся
    # гость заново переспрашивал 9 файлов CSS и 4 файла JS (около 74 КБ).
    # Если правите только этот файл — сверьтесь с тем, что стоит на сервере.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Мелких файлов много: без кэша дескрипторов nginx делает stat()
        # на каждый запрос.
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        # Постеры и кадры. Имена файлов уникальны, но содержимое по одному
        # адресу может обновиться — поэтому неделя, а не год.
        add_header Cache-Control "public, max-age=604800" always;
        open_file_cache max=2000 inactive=60s;
        open_file_cache_valid 120s;
        open_file_cache_min_uses 2;
        # Картинки уже сжаты (JPEG/WebP), и сжатие делает файл БОЛЬШЕ:
        # на замере 1 608 036 Б превратились в 1 608 625 Б — процессор
        # тратился зря, а клиент получал больше байт. Глобальный gzip
        # сервера сюда доставать не должен.
        gzip off;
    }

    location = /healthz/ {
        proxy_pass http://lumibox_app;
        access_log off;
    }

    location / {
        proxy_pass http://lumibox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django узнаёт исходный протокол отсюда (SECURE_PROXY_SSL_HEADER).
        # Берём то, что передал TLS-терминатор (Traefik/Coolify), а не $scheme:
        # $scheme здесь всегда http, и переписывание запускало бы бесконечный
        # редирект — Django видел бы http, слал бы 301 на https, и так по кругу.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
