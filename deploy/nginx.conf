# Nginx перед gunicorn — для самостоятельного хостинга (VPS, Coolify, Hetzner).
# На PaaS (Render/Railway/Fly) он не нужен: там прокси и TLS даёт платформа.
# TLS-сертификаты здесь не прописаны намеренно — их выдаёт Certbot или сам
# Coolify/Traefik. Это апстрим-конфиг для HTTP за уже терминированным TLS.

upstream lumibox_app {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Постеры и кадры весят до 5 МБ — поднимаем лимит тела запроса.
    client_max_body_size 10M;

    # Статику и медиа отдаёт nginx напрямую — быстрее и не занимает
    # воркеры gunicorn. Требует общие тома static_data и media_data.
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location = /healthz/ {
        proxy_pass http://lumibox_app;
        access_log off;
    }

    location / {
        proxy_pass http://lumibox_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django узнаёт исходный протокол отсюда (SECURE_PROXY_SSL_HEADER).
        # Берём то, что передал TLS-терминатор (Traefik/Coolify), а не $scheme:
        # $scheme здесь всегда http, и переписывание запускало бы бесконечный
        # редирект — Django видел бы http, слал бы 301 на https, и так по кругу.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_redirect off;
    }
}
