# LumiBox — Render Blueprint, ПЛАТНЫЙ always-on вариант.
# Чтобы использовать: переименуйте этот файл в render.yaml (Render читает
# Blueprint именно с таким именем) и задеплойте.
#
# Отличия от бесплатного render.yaml: web и воркер не засыпают, есть Redis
# (общий кэш и брокер Celery), отдельный воркер с планировщиком и постоянный
# диск под загруженные медиа. Стоит примерно $7/мес за сервис — оплата за вами.

databases:
  - name: lumibox-db
    databaseName: lumibox
    user: lumibox
    plan: starter
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: lumibox-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: lumibox-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz/
    disk:
      name: lumibox-media
      mountPath: /app/media
      sizeGB: 1
    # Миграции обязательны, наполнение демоданными — нет: его отказ не должен
    # блокировать выкладку уже проверенного кода.
    preDeployCommand: "python manage.py migrate --noinput && { python manage.py ensure_demo_data || echo 'ensure_demo_data failed - continuing'; }"
    dockerCommand: sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 3 --threads 4 --timeout 300"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: lumibox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lumibox-redis
          property: connectionString
      - key: DJANGO_NUM_PROXIES
        value: "1"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

      # --- Vibix (реальный внешний плеер) ---
      - key: VIBIX_PUBLISHER_ID
        value: "678503345"
      - key: VIBIX_API_TOKEN
        sync: false
      - key: VIBIX_API_BASE_URL
        value: https://vibix.org/api/v1
      - key: VIDEO_SERVICE_TRAILER
        value: "true"

      # --- Sentry (опционально) ---
      - key: SENTRY_DSN
        sync: false

      # --- Google Analytics (опционально) ---
      - key: GA_MEASUREMENT_ID
        sync: false

      # --- Email / SMTP (опционально, но нужен для сброса пароля) ---
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "LumiBox <noreply@lumibox.app>"

  - type: worker
    name: lumibox-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    dockerCommand: celery -A config worker -B -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: lumibox-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: lumibox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lumibox-redis
          property: connectionString
      # Планировщик синхронизации должен видеть ту же конфигурацию Vibix,
      # что и web-процесс. Секрет не дублируется — берётся у web-сервиса.
      - key: VIBIX_PUBLISHER_ID
        value: "678503345"
      - key: VIBIX_API_TOKEN
        fromService:
          type: web
          name: lumibox-web
          envVarKey: VIBIX_API_TOKEN
      - key: VIBIX_API_BASE_URL
        value: https://vibix.org/api/v1
