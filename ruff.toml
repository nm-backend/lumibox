# Настройки линтера.

# 119 — лимит из официального style guide самого Django.
# Со 100 не живут русские verbose_name и fieldsets: строки лезут за край
# не от небрежности, а от длины подписей.
line-length = 119

# Миграции пишет Django — правила стиля к ним неприменимы.
exclude = ["*/migrations/*", ".venv"]

[lint]
select = [
    "F",   # ошибки: неиспользуемые импорты и переменные, опечатки в именах
    "E",   # стиль PEP 8
    "W",   # предупреждения PEP 8
    "I",   # порядок импортов
    "DJ",  # правила, специфичные для Django
]

# F403/F405 — «from .base import *» в настройках.
# Это общепринятый способ разделения settings в Django, а не небрежность.
ignore = ["F403", "F405"]

[lint.per-file-ignores]
# seed_data.py — это данные, а не код: описания фильмов длиннее лимита
# по своей природе. Резать текст переносами ради линтера бессмысленно.
"apps/catalog/seed_data.py" = ["E501"]

[lint.isort]
known-first-party = ["apps", "config"]
