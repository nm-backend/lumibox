{% load i18n static %}
{% get_current_language as LANGUAGE_CODE %}

{# Sidebar ads — only on large screens (≥1750px) #}
<aside class="ad-rail ad-rail--left" role="complementary" aria-label="{% trans 'Реклама' %}">
    <div class="ad-rail__inner">
        <span class="ad-rail__label">{% trans "Реклама" %}</span>
        <a class="ad-rail__link" href="#" target="_blank" rel="noopener noreferrer">
            <img class="ad-rail__banner"
                 src="{% static 'img/ad-placeholder.svg' %}"
                 width="160" height="600"
                 alt="{% trans 'Рекламный баннер' %}"
                 loading="lazy">
        </a>
        <span class="ad-rail__disclaimer">{% trans "Реклама · 16+" %}</span>
    </div>
</aside>

<aside class="ad-rail ad-rail--right" role="complementary" aria-label="{% trans 'Реклама' %}">
    <div class="ad-rail__inner">
        <span class="ad-rail__label">{% trans "Реклама" %}</span>
        <a class="ad-rail__link" href="#" target="_blank" rel="noopener noreferrer">
            <img class="ad-rail__banner"
                 src="{% static 'img/ad-placeholder.svg' %}"
                 width="160" height="600"
                 alt="{% trans 'Рекламный баннер' %}"
                 loading="lazy">
        </a>

    </div>
</aside>
