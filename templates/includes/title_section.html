{% load i18n %}
{% if section_titles %}
    <section class="section">
        <div class="section__header">
            <h2 class="section__title">{% trans section_title %}</h2>
            {% if section_url %}
                <a class="section__link" href="{{ section_url }}">{% trans "Все" %} →</a>
            {% endif %}
        </div>

        <div class="title-grid title-grid--scroll">
            {% for title in section_titles %}
                {% include "includes/title_card.html" %}
            {% endfor %}
        </div>
    </section>
{% endif %}
