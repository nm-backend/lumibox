{% load i18n icons %}

{% if section_titles %}
    <section class="section reveal {% if section_class %}{{ section_class }}{% endif %}">
        <div class="section__header">
            <h2 class="section__title">{{ section_title }}</h2>
            {% if section_url %}
                <a class="section__link" href="{{ section_url }}">{% trans "Все" %} →</a>
            {% endif %}
        </div>

        <div class="carousel">
            <button class="carousel__btn carousel__btn--prev" type="button" aria-label="{% trans 'Назад' %}">{% icon "chevron-left" size=18 %}</button>
            <div class="carousel__track">
                {% for title in section_titles %}
                    {% include "includes/title_card.html" %}
                {% endfor %}
            </div>
            <button class="carousel__btn carousel__btn--next" type="button" aria-label="{% trans 'Вперёд' %}">{% icon "chevron-right" size=18 %}</button>
        </div>
    </section>
{% endif %}
