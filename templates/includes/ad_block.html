{% load i18n static %}
{% get_current_language as LANGUAGE_CODE %}

{# Horizontal ad block — shows between content sections #}
<section class="ad-block" aria-label="{% trans 'Реклама' %}">
    <div class="ad-block__inner">
        <div class="ad-block__badge">
            <span>{% trans "Реклама" %}</span>
        </div>
        <a class="ad-block__link" href="#" target="_blank" rel="noopener noreferrer">
            <img class="ad-block__banner ad-block__banner--leaderboard"
                 src="{% static 'img/ad-leaderboard-placeholder.svg' %}"
                 width="728" height="90"
                 alt="{% trans 'Рекламный баннер 728×90' %}"
                 loading="lazy">
        </a>
        <p class="ad-block__caption">
            {% trans "Реклама на LumiBox — привлекайте новую аудиторию" %}
            <a class="ad-block__cta" href="#">{% trans "Узнать" %}</a>
        </p>
    </div>
</section>
