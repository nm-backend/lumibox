{% load i18n %}
{% comment %}
Панель фильтров каталога.
{% endcomment %}

<details class="filters" open>
    <summary class="filters__summary">{% trans "Фильтры" %}</summary>

    <form class="filters__body" action="{{ request.path }}" method="get">
        {% for field in filter_form %}
            <div class="filters__field">
                <label class="filters__label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}

        <div class="filters__actions">
            <button class="button button--primary" type="submit">{% trans "Показать" %}</button>
            {% if active_filters or request.GET.q %}
                <a class="button button--ghost" href="{{ request.path }}">{% trans "Сбросить" %}</a>
            {% endif %}
        </div>
    </form>
</details>
